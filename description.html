<!DOCTYPE html>

 <title>Description List Example</title>
</head>
<body>
 <h2>Computer Terminologies</h2>
 <dl>
 <dt>HTML</dt>
 <dd>HyperText Markup Language, used to structure web pages</dd>
 <dt>CSS</dt>
 <dd>Cascading Style Sheets, used to style web pages.</dd>
 <dt>CPU</dt>
 <dd>Central Processing Unit, the main processor of a computer.</dd>
 <dt>URL</dt>
 <dd>Uniform Resource Locator, the address of a resource on the internet.</dd>
 </dl>
</body>
</html>
